plugins {
    id 'net.neoforged.moddev' version '1.0.11'
    id 'maven-publish'
}

version = rootProject.mod_version
group = rootProject.maven_group

repositories {
    maven { url 'https://maven.su5ed.dev/releases' }
    mavenCentral()
}

dependencies {
    api project(':')
    implementation "net.neoforged.fancymodloader:loader:${rootProject.loader_version}"
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${rootProject.forgified_fabric_api_version}"
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

sourceSets {
    main {
        java {
            srcDir project(':').file('src/main/java')
        }
        resources {
            srcDir project(':').file('src/main/resources')
        }
    }
}

neoForge {
    version = rootProject.neoForge_version
    validateAccessTransformers = false

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "chattabs-reloaded" {
            sourceSet sourceSets.main
        }
    }
}

publishing { publications { create('mavenJava', MavenPublication) { from components.java } } }
