pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version loom_version
    }
}

include 'fabric'
include 'neoforge'
